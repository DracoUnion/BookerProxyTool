[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BookerProxyTool"
version = "2026.10.13.0"
description = "iBooker/DracoUnion 代理工具"
readme = "README.md"
license = {text = "SATA"}
requires-python = ">=3.8"
authors = [
    {name = "wizardforcel", email = "wizard.z@qq.com"},
]
keywords = [
    "wiki",
    "知识库",
    "proxy",
    "代理",
    "crawler",
    "爬虫",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "requests[socks]",
    "sqlalchemy",
    "flask",
    "camoufox",
]

[project.urls]
Homepage = "https://github.com/DracoUnion/BookerProxyTool"

[project.scripts]
BookerProxyTool = "BookerProxyTool.__main__:main"
proxy-tool = "BookerProxyTool.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["BookerProxyTool*"]

[tool.setuptools.package-data]
"*" = ["*"]
